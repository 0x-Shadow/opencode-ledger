name: CI

on:
  push:
    branches: [master, main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    name: ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install ruff
      - run: ruff check .

  smoke:
    name: install + endpoint smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install package
        run: python -m pip install -e .
      - name: CLI smoke test
        run: |
          opencode-ledger version
          opencode-ledger config --json > /dev/null
          python -m opencode_ledger version
      - name: Serve demo and check every route
        run: make smoke

  docker:
    name: docker build + demo smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build image
        run: docker build -t opencode-ledger:ci .
      - name: Run demo container
        run: |
          docker run -d --name ledger-ci -p 127.0.0.1:8765:8765 \
            opencode-ledger:ci opencode-ledger demo
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8765/api/healthz; then
              echo
              echo "healthz OK after ${i}s"
              exit 0
            fi
            sleep 1
          done
          echo "container did not become healthy" >&2
          docker logs ledger-ci >&2
          exit 1
