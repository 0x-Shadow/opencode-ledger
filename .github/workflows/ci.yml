name: CI

on:
  push:
    branches: [master, main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: tests (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package
        run: python -m pip install -e .
      - name: Unit tests
        run: python -m unittest -q
      - name: CLI smoke test
        run: |
          opencode-ledger version
          python -m opencode_ledger version

  lint:
    name: ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install ruff
      - run: ruff check .

  docker:
    name: docker build + demo smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t opencode-ledger:ci .
      - name: Run demo container
        run: |
          docker run -d --name ledger-ci -p 127.0.0.1:8765:8765 \
            opencode-ledger:ci opencode-ledger demo
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8765/api/healthz; then
              echo
              echo "healthz OK after ${i}s"
              exit 0
            fi
            sleep 1
          done
          echo "container did not become healthy" >&2
          docker logs ledger-ci >&2
          exit 1
